name: scanpro_document_scanner
description: ScanPro cross-platform document scanner application.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  syncfusion_flutter_pdf: ^35.2.12
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  permission_handler: ^11.3.1
  doc_scan_flutter: ^2.0.0
  google_mlkit_text_recognition: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
