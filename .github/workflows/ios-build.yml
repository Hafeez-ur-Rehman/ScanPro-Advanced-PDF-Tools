name: iOS unsigned build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'firebase/**'
      - 'firebase.json'
      - 'pubspec.yaml'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project files if missing
        run: flutter create --platforms=ios --org com.scanpro.app .
      - name: Install dependencies
        run: flutter pub get
      - name: Verify package resolution
        run: flutter pub deps --style=compact
      - name: Build iOS app (unsigned)
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
          --dart-define=FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
          --dart-define=FIREBASE_ANDROID_APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID }}"
          --dart-define=FIREBASE_IOS_APP_ID="${{ secrets.FIREBASE_IOS_APP_ID }}"
          --dart-define=FIREBASE_WEB_APP_ID="${{ secrets.FIREBASE_WEB_APP_ID }}"
          --dart-define=FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
      - name: Package app bundle
        run: cd build/ios/iphoneos && zip -r ../../../ScanPro-iOS-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: scanpro-ios-unsigned
          path: ScanPro-iOS-unsigned.zip
          if-no-files-found: error
