name: Android APK and Play Store AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'firebase/**'
      - 'firebase.json'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files if missing
        run: flutter create --platforms=android --org com.scanpro.app .
      - name: Install dependencies
        run: flutter pub get
      - name: Verify package resolution
        run: flutter pub deps --style=compact
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
          --dart-define=FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
          --dart-define=FIREBASE_ANDROID_APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID }}"
          --dart-define=FIREBASE_IOS_APP_ID="${{ secrets.FIREBASE_IOS_APP_ID }}"
          --dart-define=FIREBASE_WEB_APP_ID="${{ secrets.FIREBASE_WEB_APP_ID }}"
          --dart-define=FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
      - name: Build Play Store App Bundle
        run: >-
          flutter build appbundle --release
          --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
          --dart-define=FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
          --dart-define=FIREBASE_ANDROID_APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID }}"
          --dart-define=FIREBASE_IOS_APP_ID="${{ secrets.FIREBASE_IOS_APP_ID }}"
          --dart-define=FIREBASE_WEB_APP_ID="${{ secrets.FIREBASE_WEB_APP_ID }}"
          --dart-define=FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
      - uses: actions/upload-artifact@v4
        with:
          name: scanpro-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
